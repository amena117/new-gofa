<!-- Toggle Button (only shows when sidebar is closed) -->
<button class="sidebar-toggle" (click)="toggleSidebar()" *ngIf="!showSidebar">
  <span class="toggle-icon">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </span>
</button>

<!-- Backdrop -->
<div class="sidebar-backdrop" *ngIf="showSidebar" (click)="toggleSidebar()"></div>

<div class="sidebar" [ngClass]="{ 'closed': !showSidebar }">
    <!-- Profile Section with Close Button -->
    <div class="profile-section">
      <div class="profile-info">
        <p class="username">{{ firstname }} {{ lastname }}</p>
        <p class="role">{{ role }}</p>
      </div>
      <button class="close-btn" (click)="toggleSidebar()">×</button>
    </div>
  
    <!-- Navigation Menu -->
    <ul>
      <li *ngFor="let item of filteredMenuItems">
        <a [routerLink]="item.link" routerLinkActive="active" class="menu-link-wrapper" (click)="onNavigate()">
          {{ item.label }}
          <span *ngIf="item.link === '/from-transit' && pendingItemsCount > 0" class="notification-badge">
            {{ pendingItemsCount }}
          </span>
          <span *ngIf="item.link === '/maintenance/request-form' && pendingLettersCount > 0" class="notification-badge">
            {{ pendingLettersCount }}
          </span>
          <span *ngIf="item.link === '/maintenance/spare-parts-requests' && pendingSparePartsCount > 0" class="notification-badge">
            {{ pendingSparePartsCount }}
          </span>
          <span *ngIf="item.link === '/maintenance/power-maintReqList' && (pendingAssignmentsCount > 0 || pendingMaintRequestsCount > 0)" class="notification-badge">
            {{ pendingAssignmentsCount + pendingMaintRequestsCount }}
          </span>
          <span *ngIf="item.link === '/maintenance/givenSparesto' && sparePartIssuedCount > 0" class="notification-badge notification-badge--alert">
            {{ sparePartIssuedCount }}
          </span>
          <span *ngIf="item.link === '/maintenance/Give-maintainedEqupment' && undeliveredMaintainedCount > 0 && role === 'PPC'" class="notification-badge">
            {{ undeliveredMaintainedCount }}
          </span>
          <span *ngIf="item.link === '/maintenance/doOut' && doOutCount > 0" class="notification-badge notification-badge--alert">
            {{ doOutCount }}
          </span>
        </a>
      </li>
      <li>
        <button class="logout-btn" (click)="onLogout()">
          Logout / ውጣ
        </button>
      </li>
    </ul>
  </div>
