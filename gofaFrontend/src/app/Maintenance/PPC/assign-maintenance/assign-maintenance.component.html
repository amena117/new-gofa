<div class="container">
  <h2>በኢፌዲሪ መከላከያ ሚኒስቴር በመገናኛና እንፎርሜሽን ዋና መምሪያ <br>
  Assign Maintenance / የጠጋኝ ንብረት መመደቢያ</h2>

  <!-- Form for Maintenance Assignment -->
  <form (ngSubmit)="onSubmit()">
    <!-- Works Order Number -->
    <div class="form-group">
      <label for="worksOrderNumber">Works Order Number / የስራ ትዕዛዝ ቁጥር</label>
      <input
        type="text"
        id="worksOrderNumber"
        class="form-control"
        [(ngModel)]="worksOrderNumber"
        name="worksOrderNumber"
        readonly
      />
    </div>

    <!-- Model Number -->
    <div class="form-group">
      <label for="modelNumber">Model Number / የሞዴል ቁጥር</label>
      <input
        type="text"
        id="modelNumber"
        class="form-control"
        [(ngModel)]="modelNumber"
        name="modelNumber"
        required
      />
    </div>

    <!-- Maintenance Type -->
    <div class="form-group">
      <label for="maintenanceType">Maintenance Type / የጥገና አይነት</label>
      <select
        id="maintenanceType"
        class="form-control"
        [(ngModel)]="maintenanceType"
        name="maintenanceType"
        (change)="updateRequestedTo()"
        required
      >
        <option value="">-- Select Maintenance Type / የጥገና አይነት ይምረጡ --</option>
        <option value="Office_machine">Office_machine</option>
        <option value="POWER">POWER</option>
        <option value="RADIO_MAINTENANCE">RADIO_MAINTENANCE</option>
      </select>
    </div>

    <!-- Requested To -->
    <div class="form-group">
      <label for="requestedTo">Requested To / የተጠየቀው ቦታ</label>
      <input
        type="text"
        id="requestedTo"
        class="form-control"
        [(ngModel)]="requestedTo"
        name="requestedTo"
        readonly
      />
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary">Submit / አስገባ</button>
  </form>
</div>
