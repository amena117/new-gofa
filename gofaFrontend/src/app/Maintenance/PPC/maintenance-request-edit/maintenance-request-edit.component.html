<div class="container mt-4">
  <h3 class="mb-4">Edit Maintenance Request</h3>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2">Loading request...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Edit Form -->
  <form *ngIf="!isLoading && editRequest" (ngSubmit)="onSubmit()" #editForm="ngForm">
    <div class="mb-3">
      <label class="form-label">Nomenclature</label>
      <input type="text" class="form-control" [(ngModel)]="editRequest.nomenclature" name="nomenclature" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Quantity</label>
      <input type="number" class="form-control" [(ngModel)]="editRequest.quantity" name="quantity" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Requested By</label>
      <input type="text" class="form-control" [(ngModel)]="editRequest.requestedBy" name="requestedBy" />
    </div>

    <div class="mb-3">
      <label class="form-label">Serial No</label>
      <input type="text" class="form-control" [(ngModel)]="editRequest.serialNoOfEquip" name="serialNoOfEquip" />
    </div>

    <div class="text-end">
      <button type="button" class="btn btn-secondary me-2" (click)="router.navigate(['/maintenance/register-list'])">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || isLoading">
        Save Changes
      </button>
    </div>
  </form>
</div>
