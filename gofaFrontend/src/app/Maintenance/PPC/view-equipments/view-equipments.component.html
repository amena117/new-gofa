<div class="container mt-5">
    <h2>በኢፌዲሪ መከላከያ ሚኒስቴር በመገናኛና እንፎርሜሽን ዋና መምሪያ <br>
  List of Equipment Types</h2>
    <table class="table table-striped">
      <thead>
  <tr>
    <th>ID</th>
    <th>Equipment Type</th>
    <th>Equipment Model</th> <!-- Now we have 3 columns -->
  </tr>
</thead>
<tbody>
  <tr *ngFor="let equipment of equipmentTypes">
    <td>{{ equipment.equipmentTypeId }}</td>
    <td>{{ equipment.equipmentTypeName }}</td>
    <td>{{ equipment.equipmentModel }}</td> <!-- ✅ Added -->
  </tr>
</tbody>
    </table>
  
    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger mt-4">
      {{ errorMessage }}
    </div>
  </div>
