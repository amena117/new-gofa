<div class="container">
    <h2>በኢፌዲሪ መከላከያ ሚኒስቴር በመገናኛና እንፎርሜሽን ዋና መምሪያ <br>
  Special Tool Details</h2>
    <div *ngIf="tool; else loading">
      <p><strong>ID:</strong> {{ tool.id }}</p>
      <p><strong>Recieved By:</strong> {{ tool.recievedBy }}</p>
      
      <p><strong>Description:</strong> {{ tool.description }}</p>
      <p><strong>Part Number:</strong> {{ tool.partNumber }}</p>
   
      <p><strong>Return Date:</strong> {{ tool.returnDate | date }}</p>
   
      <p><strong>Given By:</strong> {{ tool.givenBy }}</p>
    
    </div>
    <ng-template #loading>
      <p>Loading tool details...</p>
    </ng-template>
    <button class="btn btn-secondary" routerLink="/maintenance/special-tools">Back to List</button>
  </div>
