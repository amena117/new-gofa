<div class="container">
  <h2>በኢፌዲሪ መከላከያ ሚኒስቴር በመገናኛና እንፎርሜሽን ዋና መምሪያ <br>
  Maintain Request Form</h2>

  <form (ngSubmit)="onSubmit()">
    <!-- Works Order Number -->
    <div class="form-group">
      <label for="worksOrderNumber">Works Order Number</label>
      <input
        type="text"
        id="worksOrderNumber"
        class="form-control"
        [(ngModel)]="formData.worksOrderNumber"
        name="worksOrderNumber"
        readonly
      />
    </div>

    <!-- Status -->
    <div class="form-group">
      <label for="status">Status</label>
      <select
        id="status"
        class="form-control"
        [(ngModel)]="formData.status"
        name="status"
        required
        (change)="onStatusChange()"
      >
        <option value="">-- Select Status --</option>
        <option *ngFor="let s of allowedStatuses" [value]="s.value">{{ s.label }}</option>
      </select>
    </div>

    <!-- Maintained By / Recorded By (auto-filled, read-only) -->
    <div class="form-group">
      <label for="maintainedBy">Maintained By / ጠጋኝ (Recorded Automatically)</label>
      <input
        type="text"
        id="maintainedBy"
        class="form-control"
        [value]="currentUserFullName"
        name="maintainedBy"
        readonly
        style="background: #f8f9fa; border: 1px solid #ced4da; font-weight: 600; color: #495057;"
      />
      <small class="text-muted">This name will be saved as the technician for this record / ይህ ስም እንደ ጠጋኝ ይመዘገባል</small>
    </div>

    <!-- Repair Finish Date -->
    <div class="form-group">
      <label for="repairFinishDate">Repair Finish Date</label>
      <input
        type="date"
        id="repairFinishDate"
        class="form-control"
        [(ngModel)]="formData.repairFinishDate"
        name="repairFinishDate"
        required
      />
    </div>

    <!-- Manhours -->
    <div class="form-group">
      <label for="manhours">Manhours</label>
      <input
        type="number"
        id="manhours"
        class="form-control"
        [(ngModel)]="formData.manhours"
        name="manhours"
        min="0"
        required
      />
    </div>

    <!-- Remark -->
    <div class="form-group">
      <label for="remark">
        Remark / ማስታወሻ
        <span *ngIf="isDoOut" class="req-star"> * </span>
        <span *ngIf="isDoOut" class="do-out-hint">(Required for Do Out — explain why the item cannot be repaired)</span>
      </label>
      <textarea
        id="remark"
        class="form-control"
        [class.remark-required]="isDoOut"
        [(ngModel)]="formData.remark"
        name="remark"
        rows="3"
        [placeholder]="isDoOut ? 'Required: Explain why the item is Do Out (e.g. beyond repair, missing parts, etc.)' : 'Optional remark...'"
      ></textarea>
      <small *ngIf="isDoOut && !formData.remark.trim()" class="remark-warning">
        ⚠️ Remark is required for Do Out
      </small>
    </div>

    <button type="submit" class="btn btn-success">Update</button>
    <button type="button" class="btn btn-secondary" (click)="goBack()">Cancel</button>
  </form>
</div>
