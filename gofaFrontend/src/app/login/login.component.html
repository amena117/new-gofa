<div class="login-wrapper">
  <div class="login-form">
    <h1 lang="en">Login - <span lang="am">ግባ</span></h1>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="auth-form">
      <!-- Username -->
      <div class="form-group">
        <label for="username" lang="en">Username</label>
        <label for="username" lang="am">የተጠቃሚ ስም</label>
        <input id="username" type="text" [(ngModel)]="loginModel.username" name="username" required
          [disabled]="isLoading" placeholder="Enter username / የተጠቃሚ ስሙን ያስገቡ" />
      </div>

      <!-- Password -->
      <div class="form-group password-group">
        <label for="password" lang="en">Password</label>
        <label for="password" lang="am">የይለፍ ቃል</label>
        <div class="input-with-icon">
          <input id="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="loginModel.password"
            name="password" required [disabled]="isLoading" placeholder="Enter password / የይለፍ ቃሉን ያስገቡ" />
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" [disabled]="isLoading" title="Show/Hide Password">
            <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Error Message -->
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-box">
        <p>
          <strong>{{ errorMessage }}</strong>
          <br />
          <small *ngIf="errorMessage.includes('disabled')">
            Contact your system administrator for assistance.
          </small>
        </p>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="login-button" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login / ግባ' }}
      </button>
    </form>
  </div>
</div>
