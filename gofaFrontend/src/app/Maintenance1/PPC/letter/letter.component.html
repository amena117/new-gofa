<h2>የ ሜንቴናንስ ደብዳቤዎች</h2>
<div *ngIf="loading">Loading letters...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<table *ngIf="!loading && letters.length > 0" class="letter-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>From</th>
      <th>Reason</th>
      <th>Status</th>
      <th>Created Date</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let letter of letters">
      <td>{{ letter.letterId }}</td>
      <td>{{ letter.from }}</td>
      <td>{{ letter.recommendBy }}</td>
      <td>{{ letter.status }}</td>
      <td>{{ letter.createdDate | date: 'short' }}</td>
    </tr>
  </tbody>
</table>

<div *ngIf="!loading && letters.length === 0">
  No letters found.
</div>
