<div class="container mt-4" style="max-width:600px">
  <h2>Maintain Request / የጥገና ቅጽ</h2>

  <form (ngSubmit)="onSubmit()" #maintainForm="ngForm">

    <div class="mb-3">
      <label class="form-label">Works Order Number / የሥራ ትዕዛዝ ቁጥር</label>
      <input type="text" class="form-control" [value]="formData.worksOrderNumber" readonly />
    </div>

    <div class="mb-3">
      <label class="form-label">Status / ሁኔታ <span class="text-danger">*</span></label>
      <select class="form-select" [(ngModel)]="formData.status" name="status" required>
        <option value="">-- Select Status --</option>
        <option *ngFor="let s of statusOptions" [value]="s.value">{{ s.label }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Repair Finish Date / የጥገና ማጠናቀቂያ ቀን <span class="text-danger">*</span></label>
      <input type="date" class="form-control"
        [(ngModel)]="formData.repairFinishDate" name="repairFinishDate" required />
    </div>

    <div class="mb-3">
      <label class="form-label">Man Hours / የሰው ሰዓት (rate: 250 ETB/hr)</label>
      <input type="number" class="form-control" [(ngModel)]="formData.manhours"
        name="manhours" min="0" step="0.5" />
      <div class="form-text text-muted" *ngIf="formData.manhours > 0">
        Labor Cost: <strong>{{ laborCost | number:'1.2-2' }} ETB</strong>
        ({{ formData.manhours }} hrs × 250 ETB)
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">
        Remark / ማስታወሻ
        <span *ngIf="isDoOut" class="text-danger"> *</span>
        <small *ngIf="isDoOut" class="text-danger ms-1">(Required — explain why item cannot be repaired)</small>
      </label>
      <textarea class="form-control" [(ngModel)]="formData.remark"
        name="remark" rows="3"
        [class.border-danger]="isDoOut && !formData.remark.trim()"
        [placeholder]="isDoOut ? 'Required: Explain why the item is Do Out (e.g. beyond repair, missing parts, damage description...)' : 'Optional remark...'">
      </textarea>
      <div *ngIf="isDoOut && !formData.remark.trim()" class="text-danger small mt-1">
        ⚠️ Remark is required for Do Out
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success" [disabled]="isSubmitting || maintainForm.invalid">
        {{ isSubmitting ? 'Saving...' : 'Update / አዘምን' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="goBack()">Cancel / ሰርዝ</button>
    </div>
  </form>
</div>
