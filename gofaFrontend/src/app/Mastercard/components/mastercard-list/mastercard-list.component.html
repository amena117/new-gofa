<div class="content-container">
  <button class="btn btn-primary btn-sm" [routerLink]="['/MasterCard/mastercard-form']">
    + Add New Item
  </button>
  <div class="card shadow-sm mt-4">
    <div class="card-header  text-white d-flex justify-content-between align-items-center " style="background-color: #03203c;">
      <h5 class="mb-0">Received Items</h5>
      <div class="form-group">
        <input
          id="searchInput"
          type="text"
          class="form-control"
          [(ngModel)]="searchQuery"
          (input)="onSearch()"
          placeholder="Search by Model, Part Number, Description, etc."
        />
      </div>
      <div class="form-group">
        <select
          id="sortSelect"
          class="form-select"
          [(ngModel)]="selectedSort"
          (change)="($event)"
        >
          <option *ngFor="let option of sortOptions" [value]="option.value">
            {{ option.viewValue }}
          </option>
        </select>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Model/የንብረቱ አይነት</th>
              <th>Part Number/የእቃው መለያ ቁጥር</th>
              <th>Description/ የእቃው ስም</th>
              <th>Unit of Measure/ መለኪያ</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of paginatedCards">
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]">{{ item.model }}</td>
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]">{{ item.partNumber }}</td>
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]">{{ item.description }}</td>
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]">{{ item.unitOfMeasure }}</td>
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]">
                <!-- {{ getTotalReceivedQuantity(item) }} -->
              </td>
              <td>               
                <!-- <button class="btn btn-info btn-sm me-1"  
        [routerLink]="['/MasterCard/addmaster-card-details', item.id]">
  1. ግዚ
</button> -->
                <button class="btn btn-success btn-sm me-1"   
                 [routerLink]="['/MasterCard/master-card-received', item.id]">
                ገቢ </button>                  
           
                <button class="btn btn-warning btn-sm me-1"  
                [routerLink]="['/MasterCard/master-card-issued', item.id]">
                
                 ወጪ
                </button>
                <!-- <button class="btn btn-primary btn-sm" [routerLink]="['/MasterCard/mastercard-edit', item.id]">
                  Edit
                </button> -->
                
                <button class="btn  btn-sm me-1" style="background-color: #03203c; color: white;"  
                [routerLink]="['/MasterCard/master-card-details', item.id]">
          View Details / ዝርዝር እይታ
        </button>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="d-flex mt-4 justify-content-between">
          <div></div>
          <nav aria-label="Page navigation">
            <ul class="pagination">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="onPageChange(currentPage - 1)">«</a>
              </li>
              <li *ngFor="let page of getPageNumbers()" class="page-item" [class.active]="page === currentPage">
                <a class="page-link" (click)="onPageChange(page)">{{ page }}</a>
              </li>
              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" (click)="onPageChange(currentPage + 1)">»</a>
              </li>
            </ul>
          </nav>
          <div class="form-group me-4 mb-2">
            <label>Items per page</label>
            <select class="form-select" [(ngModel)]="itemsPerPage" (change)="onItemsPerPageChange()">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
