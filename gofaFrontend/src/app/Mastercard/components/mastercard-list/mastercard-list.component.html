<div class="content-container">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <button class="btn btn-primary btn-sm" [routerLink]="['/MasterCard/mastercard-form']">
      + Add New Item
    </button>

    <!-- Location Filter Buttons -->
    <div class="d-flex flex-wrap gap-2" role="group" aria-label="Location filters">
      <button
        *ngFor="let loc of locationFilterOptions"
        type="button"
        class="btn btn-sm"
        [class.btn-outline-secondary]="!selectedLocationFilters.includes(loc)"
        [class.btn-secondary]="selectedLocationFilters.includes(loc)"
        [class.text-white]="selectedLocationFilters.includes(loc)"
        (click)="toggleLocationFilter(loc)"
        attr.aria-pressed="{{ selectedLocationFilters.includes(loc) }}"
      >
        {{ loc }}
      </button>

      <button
        *ngIf="selectedLocationFilters.length > 0"
        type="button"
        class="btn btn-outline-danger btn-sm"
        (click)="clearAllFilters()"
        title="Remove all location filters"
      >
        Clear Filters
      </button>
    </div>
  </div>

  <!-- Main Card -->
  <div class="card shadow-sm">
    <div class="card-header text-white d-flex justify-content-between align-items-center flex-wrap gap-3"
         style="background-color: #03203c;">
      <h5 class="mb-0">Received Items</h5>

      <!-- Search Input -->
      <input
        type="text"
        class="form-control form-control-sm"
        style="width: 250px;"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        placeholder="Search by Model, Part Number, Description..."
      />

      <!-- Sort Dropdown -->
      <select
        class="form-select form-select-sm"
        style="width: auto;"
        [(ngModel)]="selectedSort"
        (change)="applyFilters()"
      >
        <option *ngFor="let option of sortOptions" [value]="option.value">
          {{ option.viewValue }}
        </option>
      </select>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Model / የንብረቱ አይነት</th>
              <th>Part Number / የእቃው መለያ ቁጥር</th>
              <th>Description / የእቃው ስም</th>
              <th>Unit of Measure / መለኪያ</th>
              <th>Locations / ቦታዎች</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of paginatedCards">
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]" class=" pointer">
                {{ item.model }}
              </td>
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]" class="pointer">
                {{ item.partNumber }}
              </td>
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]" class="pointer">
                {{ item.description }}
              </td>
              <td [routerLink]="['/MasterCard/mastercard-details', item.id]" class="pointer">
                {{ item.unitOfMeasure }}
              </td>

              <!-- Location Column - Now Fixed! -->
              <td class="text-nowrap">
                {{ getDisplayLocations(item) }}
              </td>

              <td class="text-center">
                <div class="btn-group" role="group">
                  <button class="btn btn-success btn-sm"
                          [routerLink]="['/MasterCard/master-card-received', item.id]"
                          title="Receive Item">
                    ገቢ
                  </button>

                  <button class="btn btn-warning btn-sm text-white"
                          [routerLink]="['/MasterCard/master-card-issued', item.id]"
                          title="Issue Item">
                    ወጪ
                  </button>

                  <button class="btn btn-sm text-white"
                          style="background-color: #03203c;"
                          [routerLink]="['/MasterCard/master-card-details', item.id]"
                          title="View Details">
                    View Details
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination -->
        <div class="d-flex justify-content-between align-items-center p-3 bg-light">
          <div></div>

          <nav aria-label="Page navigation">
            <ul class="pagination mb-0">
              <li class="page-item" [class.disabled]="currentPage === 1">
                <a class="page-link" (click)="onPageChange(currentPage - 1)">«</a>
              </li>
              <li *ngFor="let page of getPageNumbers()"
                  class="page-item"
                  [class.active]="page === currentPage">
                <a class="page-link" (click)="onPageChange(page)">{{ page }}</a>
              </li>
              <li class="page-item" [class.disabled]="currentPage === totalPages">
                <a class="page-link" (click)="onPageChange(currentPage + 1)">»</a>
              </li>
            </ul>
          </nav>

          <div class="d-flex align-items-center gap-2">
            <label class="mb-0">Items per page:</label>
            <select class="form-select form-select-sm" style="width: auto;"
                    [(ngModel)]="itemsPerPage"
                    (change)="onItemsPerPageChange()">
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
